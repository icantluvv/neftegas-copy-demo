services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gas_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-gas_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gas_dashboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gas_dashboard}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gas_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-gas_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gas_dashboard}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      CORS_ORIGIN: http://localhost:3000
      UPLOADS_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./apps/frontend
      args:
        # NEXT_PUBLIC_* встраиваются в клиентский бандл на этапе сборки next
        # build, поэтому нужны здесь как build args, а не только как runtime
        # environment ниже.
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Дэшборд Нефтегаз}
        NEXT_PUBLIC_FRONT_URL: ${NEXT_PUBLIC_FRONT_URL:-http://localhost:3000}
        NEXT_PUBLIC_BFF_PATH: ${NEXT_PUBLIC_BFF_PATH:-/api}
        NEXT_PUBLIC_BACK_URL: /api
        NEXT_PUBLIC_MOCK_MODE: ${NEXT_PUBLIC_MOCK_MODE:-false}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      # Сервер (RSC) стучится в бэкенд напрямую по внутренней docker-сети.
      BACK_INTERNAL_URL: http://backend:4000/api
      # Браузер идёт на свой origin (/api/*) — фронту нужен rewrite в
      # next.config.ts, проксирующий /api/* на BACK_INTERNAL_URL, чтобы
      # httpOnly-cookie авторизации оставались same-site без настройки CORS.
      NEXT_PUBLIC_BACK_URL: /api
      DADATA_URL: ${DADATA_URL:-http://localhost:9002}
      DADATA_TOKEN: ${DADATA_TOKEN:-local}
      PARTNER_API_TOKEN: ${PARTNER_API_TOKEN:-local}
    ports:
      - '3000:3000'

volumes:
  db_data:
  backend_uploads:
