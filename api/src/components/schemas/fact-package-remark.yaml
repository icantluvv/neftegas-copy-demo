FactPackageRemark:
  type: object
  required:
    - id
    - humanId
    - factPackageId
    - relatedFormId
    - authorId
    - createdAt
    - description
    - requiredAction
    - status
    - issuerLabel
  properties:
    id: { type: integer }
    humanId: { type: string, example: FCT-REM-000045 }
    factPackageId: { type: integer }
    cfoId:
      type: [integer, 'null']
      description: null — замечание от ДТОиР
    relatedFormId:
      type: integer
      description: Обязательная привязка к форме, к которой оставлено замечание
    authorId: { type: integer }
    createdAt: { type: string, format: date-time }
    description: { type: string }
    requiredAction: { type: string }
    status: { $ref: './fact-remark-status.yaml' }
    closedAt: { type: [string, 'null'], format: date-time }
    issuerLabel: { type: string, description: "Код ЦФО либо «ДТОиР»" }

FactPackageRemarkCreateInput:
  type: object
  required: [relatedFormId, description, requiredAction]
  properties:
    relatedFormId: { type: integer }
    description: { type: string }
    requiredAction: { type: string }
