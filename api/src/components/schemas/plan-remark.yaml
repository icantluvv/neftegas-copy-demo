PlanRemark:
  type: object
  required:
    - id
    - humanId
    - planId
    - authorId
    - createdAt
    - sheetName
    - rowRef
    - cellRef
    - description
    - requiredAction
    - status
    - issuerLabel
  properties:
    id: { type: integer }
    humanId: { type: string, example: PLR-000045 }
    planId: { type: integer }
    cfoId:
      type: [integer, 'null']
      description: null — замечание от ДТОиР
    authorId: { type: integer }
    createdAt: { type: string, format: date-time }
    relatedSlotId: { type: [integer, 'null'] }
    fileVersionId: { type: [integer, 'null'] }
    sheetName: { type: string }
    rowRef: { type: string }
    cellRef: { type: string }
    description: { type: string }
    requiredAction: { type: string }
    status: { $ref: './plan-remark-status.yaml' }
    closedById: { type: [integer, 'null'] }
    closedAt: { type: [string, 'null'], format: date-time }
    issuerLabel: { type: string, description: "Код ЦФО либо «ДТОиР»" }

PlanRemarkCreateInput:
  type: object
  required: [description, requiredAction]
  properties:
    description: { type: string }
    requiredAction: { type: string }
    sheetName: { type: string }
    rowRef: { type: string }
    cellRef: { type: string }
    relatedSlotId: { type: [integer, 'null'] }
    fileVersionId: { type: [integer, 'null'] }

PlanRemarkReopenInput:
  type: object
  required: [description, requiredAction]
  properties:
    description: { type: string }
    requiredAction: { type: string }
