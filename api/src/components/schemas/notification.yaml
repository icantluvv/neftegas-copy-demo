type: object
description: |
  Уведомление относится ровно к одной сущности — либо к корректировке
  (correctionId), либо к факт-пакету (factPackageId); в паре полей заполнено
  ровно одно, второе — null (openspec/changes/fact-package-review).
required: [id, userId, correctionId, factPackageId, text, isRead, createdAt]
properties:
  id: { type: integer }
  userId: { type: integer }
  correctionId: { type: [integer, 'null'] }
  correctionHumanId: { type: string }
  factPackageId: { type: [integer, 'null'] }
  factPackageHumanId: { type: string }
  text: { type: string }
  isRead: { type: boolean }
  createdAt: { type: string, format: date-time }
