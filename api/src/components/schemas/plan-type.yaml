PlanType:
  type: object
  required: [id, code, name, isActive]
  properties:
    id: { type: integer }
    code: { type: string }
    name: { type: string }
    description: { type: string }
    isActive: { type: boolean }

PlanTypeInput:
  type: object
  required: [code, name]
  properties:
    code: { type: string }
    name: { type: string }
    description: { type: string }
    isActive: { type: boolean, default: true }

PlanTypeDetail:
  allOf:
    - $ref: './plan-type.yaml#/PlanType'
    - type: object
      properties:
        requirements:
          type: array
          items: { $ref: './plan-package-requirement.yaml#/PlanPackageRequirement' }
