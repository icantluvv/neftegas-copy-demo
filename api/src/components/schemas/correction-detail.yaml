CorrectionDetail:
  allOf:
    - $ref: './correction.yaml#/Correction'
    - type: object
      required:
        - filial
        - cfo
        - correctionType
        - author
        - slots
        - cfoStatuses
        - remarks
        - history
        - packageComplete
        - missingRequirements
        - isFilialOwner
        - isCfoOwner
        - isCfoReviewer
        - isDtoe
        - availableCfos
        - returnedCfos
      properties:
        filial:
          oneOf:
            - $ref: './filial.yaml#/Filial'
            - type: 'null'
        cfo:
          description: Заполнено, если корректировку создал сам ЦФО.
          oneOf:
            - $ref: './cfo.yaml#/Cfo'
            - type: 'null'
        correctionType: { $ref: './correction-type.yaml#/CorrectionType' }
        author: { $ref: './user.yaml#/UserSummary' }
        slots:
          type: array
          items: { $ref: './document-slot.yaml' }
        cfoStatuses:
          type: array
          items: { $ref: './correction-cfo-status.yaml' }
        remarks:
          type: array
          items: { $ref: './remark.yaml#/Remark' }
        history:
          type: array
          items: { $ref: './correction-history-entry.yaml' }
        packageComplete: { type: boolean }
        missingRequirements:
          type: array
          items: { type: string }
        myCfoStatus:
          oneOf:
            - $ref: './correction-cfo-status.yaml'
            - type: 'null'
        myOpenRemarksCount: { type: integer }
        isFilialOwner: { type: boolean }
        isCfoOwner:
          type: boolean
          description: Пакет создан этим ЦФО (свой, направляется сразу в ДТОиР без проверки другими ЦФО).
        isCfoReviewer: { type: boolean }
        isDtoe: { type: boolean }
        availableCfos:
          type: array
          description: ЦФО, доступные для отправки (linked_cfos), для формы «Направить». Пусто для пакета, созданного ЦФО (у него нет формы выбора — направление сразу в ДТОиР).
          items: { $ref: './cfo.yaml#/Cfo' }
        returnedCfos:
          type: array
          description: ЦФО в статусе RETURNED, для формы «Направить повторно»
          items: { $ref: './cfo.yaml#/Cfo' }

CfoSelectionInput:
  type: object
  required: [cfoIds]
  properties:
    cfoIds:
      type: array
      items: { type: integer }
      minItems: 1
