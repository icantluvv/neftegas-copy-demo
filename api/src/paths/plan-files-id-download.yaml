parameters:
  - { name: id, in: path, required: true, schema: { type: integer } }
get:
  summary: Скачать файл версии плана
  operationId: downloadPlanFileVersion
  tags: [Plans]
  description: |
    Открыть/скачать содержимое версии файла плана. Доступно только ролям CFO
    и DTOE (проверяющим), имеющим доступ к соответствующему плану, а также
    FILIAL-владельцу — филиал, загрузивший файл.
  responses:
    '200':
      description: Бинарное содержимое файла
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    '403':
      description: Нет доступа
      content:
        application/json:
          schema: { $ref: '../components/schemas/error-response.yaml' }
