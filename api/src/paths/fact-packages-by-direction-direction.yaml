parameters:
  - { name: direction, in: path, required: true, schema: { $ref: '../components/schemas/direction.yaml' } }
get:
  summary: Получить (или создать) факт-пакет своего филиала по направлению
  operationId: getOrCreateFactPackageByDirection
  tags: [FactPackages]
  description: |
    Доступно только роли FILIAL. Один факт-пакет на пару «Филиал × Направление»
    без периода: если пакета для (свой филиал, направление) ещё нет, он
    создаётся атомарно в статусе DRAFT вместе со всеми формами каталога
    направления (без версий файлов), и возвращается. Повторные вызовы для той
    же пары идемпотентны и возвращают тот же факт-пакет.
  responses:
    '200':
      description: Факт-пакет получен либо создан
      content:
        application/json:
          schema: { $ref: '../components/schemas/fact-package-detail.yaml#/FactPackageDetail' }
    '403':
      description: Доступно только роли FILIAL
      content:
        application/json:
          schema: { $ref: '../components/schemas/error-response.yaml' }
