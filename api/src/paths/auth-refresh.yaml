post:
  summary: Обновление access/refresh токенов
  operationId: refresh
  tags: [Auth]
  security: []
  responses:
    '200':
      description: Токены обновлены
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/AuthUser' }
    '401':
      description: Refresh-токен недействителен
      content:
        application/json:
          schema: { $ref: '../components/schemas/error-response.yaml' }
