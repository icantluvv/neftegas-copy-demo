parameters:
  - { name: humanId, in: path, required: true, schema: { type: string } }
post:
  summary: Финализировать возврат плана на доработку от лица ЦФО
  operationId: returnPlanByCfo
  tags: [Plans]
  description: |
    Роль CFO. Переводит план в «Возвращено на доработку», а статус этого
    ЦФО — в «Возвращено». Требует, чтобы у этого ЦФО уже было оставлено
    хотя бы одно открытое замечание по этому плану
    (`POST /plans/{humanId}/remarks`) — иначе `400`.
  responses:
    '200':
      description: Возвращено на доработку
      content:
        application/json:
          schema: { $ref: '../components/schemas/plan-detail.yaml#/PlanDetail' }
