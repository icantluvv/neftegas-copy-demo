parameters:
  - { name: humanId, in: path, required: true, schema: { type: string } }
post:
  summary: Оставить замечание к элементу пакета плана
  operationId: leavePlanRemark
  tags: [Plans]
  description: |
    Роли CFO и DTOE. Создаёт замечание, привязанное к элементу пакета
    (`relatedSlotId`), не меняя статус плана и статус проверяющего —
    проверяющий может оставить несколько замечаний к разным элементам за один
    заход. Возврат пакета на доработку — отдельное действие
    (`POST /plans/{humanId}/cfo-return` или `.../dtoe-return`), требующее
    хотя бы одного открытого замечания.
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../components/schemas/plan-remark.yaml#/PlanRemarkCreateInput' }
  responses:
    '200':
      description: Замечание создано
      content:
        application/json:
          schema: { $ref: '../components/schemas/plan-detail.yaml#/PlanDetail' }
