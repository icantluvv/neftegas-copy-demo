parameters:
  - { name: humanId, in: path, required: true, schema: { type: string } }
post:
  summary: Повторно направить ЦФО после исправления замечаний
  operationId: resubmitCorrection
  tags: [Corrections]
  description: Повторное направление только тем ЦФО, которые вернули замечания.
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../components/schemas/correction-detail.yaml#/CfoSelectionInput' }
  responses:
    '200':
      description: Повторно направлено
      content:
        application/json:
          schema: { $ref: '../components/schemas/correction-detail.yaml#/CorrectionDetail' }
