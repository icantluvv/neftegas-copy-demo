parameters:
  - { name: id, in: path, required: true, schema: { type: integer } }
get:
  summary: Скачать файл версии формы факт-пакета
  operationId: downloadFactFormVersion
  tags: [FactPackages]
  description: |
    Открыть/скачать содержимое версии файла формы. Доступно ролям CFO и DTOE
    (проверяющим) с доступом к факт-пакету, а также FILIAL-владельцу
    факт-пакета.
  responses:
    '200':
      description: Бинарное содержимое файла
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    '403':
      description: Нет доступа
      content:
        application/json:
          schema: { $ref: '../components/schemas/error-response.yaml' }
