parameters:
  - { name: id, in: path, required: true, schema: { type: integer } }
post:
  summary: Добавить требование в пакет типа корректировки
  operationId: createPackageRequirement
  tags: [Org]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../components/schemas/package-requirement.yaml#/PackageRequirementInput' }
  responses:
    '201':
      description: Требование добавлено
      content:
        application/json:
          schema: { $ref: '../components/schemas/package-requirement.yaml#/PackageRequirement' }
