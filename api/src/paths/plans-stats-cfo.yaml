get:
  summary: Статистика по планам для раздела ЦФО
  operationId: getPlanStatsCfo
  tags: [Plans]
  description: Доступно только пользователю роли CFO.
  responses:
    '200':
      description: Агрегированные счётчики в рамках видимости роли CFO
      content:
        application/json:
          schema: { $ref: '../components/schemas/plan-stats.yaml' }
    '403':
      description: У пользователя не роль CFO
      content:
        application/json:
          schema: { $ref: '../components/schemas/error-response.yaml' }
