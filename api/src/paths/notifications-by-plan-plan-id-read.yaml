parameters:
  - { name: planId, in: path, required: true, schema: { type: integer } }
post:
  summary: Отметить прочитанными все уведомления пользователя по одному плану
  operationId: markNotificationsReadByPlan
  tags: [Notifications]
  description: |
    Вызывается при открытии карточки плана — помечает прочитанными все
    уведомления текущего пользователя, связанные с этим планом, независимо
    от того, попал ли пользователь на карточку через клик по уведомлению или
    напрямую. Идемпотентно — уже прочитанные записи повторно не
    пересчитываются.
  responses:
    '200':
      description: Уведомления помечены прочитанными
      content:
        application/json:
          schema:
            type: object
            required: [updatedCount]
            properties:
              updatedCount: { type: integer, description: 'Число записей, реально переведённых из непрочитанных в прочитанные' }
