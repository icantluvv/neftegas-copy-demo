parameters:
  - { name: humanId, in: path, required: true, schema: { type: string } }
post:
  summary: Финализировать возврат на доработку от лица ДТОиР
  operationId: returnCorrectionByDtoe
  tags: [Corrections]
  description: |
    Роль DTOE. Переводит корректировку в «Возвращено ДТОиР». Требует, чтобы
    ДТОиР уже оставил хотя бы одно открытое замечание по этой корректировке
    (`POST /corrections/{humanId}/remarks`) — иначе `400`.
  responses:
    '200':
      description: Возвращено ДТОиР на доработку
      content:
        application/json:
          schema: { $ref: '../components/schemas/correction-detail.yaml#/CorrectionDetail' }
