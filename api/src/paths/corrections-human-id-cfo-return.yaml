parameters:
  - { name: humanId, in: path, required: true, schema: { type: string } }
post:
  summary: Финализировать возврат на доработку от лица ЦФО
  operationId: returnCorrectionByCfo
  tags: [Corrections]
  description: |
    Роль CFO. Переводит корректировку в «Возвращено на доработку», а статус
    этого ЦФО — в «Возвращено». Требует, чтобы у этого ЦФО уже было оставлено
    хотя бы одно открытое замечание по этой корректировке
    (`POST /corrections/{humanId}/remarks`) — иначе `400`.
  responses:
    '200':
      description: Возвращено на доработку
      content:
        application/json:
          schema: { $ref: '../components/schemas/correction-detail.yaml#/CorrectionDetail' }
