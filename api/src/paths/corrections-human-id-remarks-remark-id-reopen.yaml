parameters:
  - { name: humanId, in: path, required: true, schema: { type: string } }
  - { name: remarkId, in: path, required: true, schema: { type: integer } }
post:
  summary: Переоткрыть замечание (исправление не принято)
  operationId: reopenRemark
  tags: [Corrections]
  description: Роль CFO (владелец замечания). Исправление не принято — переоткрыть.
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../components/schemas/remark.yaml#/RemarkReopenInput' }
  responses:
    '200':
      description: Замечание переоткрыто
      content:
        application/json:
          schema: { $ref: '../components/schemas/remark.yaml#/Remark' }
