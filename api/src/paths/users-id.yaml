parameters:
  - { name: id, in: path, required: true, schema: { type: integer } }
patch:
  summary: Обновить пользователя
  operationId: updateUser
  tags: [Users]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../components/schemas/user.yaml#/UserUpdateInput' }
  responses:
    '200':
      description: Пользователь обновлён
      content:
        application/json:
          schema: { $ref: '../components/schemas/user.yaml#/User' }
delete:
  summary: Удалить пользователя
  operationId: deleteUser
  tags: [Users]
  responses:
    '204': { description: Удалено }
