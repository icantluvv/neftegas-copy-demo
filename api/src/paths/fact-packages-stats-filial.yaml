get:
  summary: Статистика по факт-пакетам для «Рабочего стола» филиала
  operationId: getFactPackageStatsFilial
  tags: [FactPackages]
  description: Доступно только пользователю роли FILIAL.
  responses:
    '200':
      description: Агрегированные счётчики в рамках видимости роли FILIAL
      content:
        application/json:
          schema: { $ref: '../components/schemas/fact-package-stats.yaml' }
    '403':
      description: У пользователя не роль FILIAL
      content:
        application/json:
          schema: { $ref: '../components/schemas/error-response.yaml' }
