get:
  summary: Список факт-пакетов (в рамках видимости роли)
  operationId: getFactPackages
  tags: [FactPackages]
  description: >
    Список автоматически ограничен ролью: FILIAL видит свои, CFO — направленные
    его ЦФО, DTOE/ADMIN — все (аудит).
  parameters:
    - { name: direction, in: query, schema: { $ref: '../components/schemas/direction.yaml' } }
    - { name: status, in: query, schema: { $ref: '../components/schemas/fact-package-status.yaml' } }
    - { name: filialId, in: query, schema: { type: integer } }
    - { name: cfoId, in: query, schema: { type: integer } }
    - { name: q, in: query, description: Поиск по ID факт-пакета, schema: { type: string } }
    - { name: page, in: query, schema: { type: integer, default: 1 } }
    - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
  responses:
    '200':
      description: Страница факт-пакетов
      content:
        application/json:
          schema: { $ref: '../components/schemas/fact-package.yaml#/PaginatedFactPackages' }
post:
  summary: Создать факт-пакет по направлению
  operationId: createFactPackage
  tags: [FactPackages]
  description: >
    Доступно только роли FILIAL. Каждый вызов создаёт новый факт-пакет своего
    филиала для указанного направления в статусе DRAFT вместе со всеми формами
    каталога направления (без версий файлов) — по аналогии с созданием
    корректировки: один филиал может иметь одновременно несколько факт-пакетов
    одного направления (разных периодов), «Файлы» — точка входа для создания
    нового, существующие смотрят на «Рабочем столе».
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../components/schemas/fact-package.yaml#/FactPackageCreateInput' }
  responses:
    '201':
      description: Факт-пакет создан
      content:
        application/json:
          schema: { $ref: '../components/schemas/fact-package-detail.yaml#/FactPackageDetail' }
    '403':
      description: Доступно только роли FILIAL
      content:
        application/json:
          schema: { $ref: '../components/schemas/error-response.yaml' }
