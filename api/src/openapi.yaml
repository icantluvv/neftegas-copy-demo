openapi: 3.1.0

info:
  version: 1.0.0
  title: Gas Dashboard API
  description: >
    Контракт согласования корректировок (перенос бизнес-логики с Django-проекта
    soglasovanie_correction_system). Источник истины для backend (NestJS) и
    frontend (Kubb-кодоген). Пути — в api/src/paths/, схемы — в
    api/src/components/schemas/.
  license:
    name: Proprietary

servers:
  - url: /api

tags:
  - name: Auth
    description: Вход, выход (текущая сессия или все сессии), текущий пользователь
  - name: Org
    description: Справочники — филиалы, ЦФО, связи филиал-ЦФО, типы корректировок и требования пакета
  - name: Users
    description: Управление пользователями (роль ADMIN)
  - name: Corrections
    description: Жизненный цикл корректировок — создание, пакет документов, маршрут согласования, замечания
  - name: FactPackages
    description: >
      Модуль «Факт» — экран «Файлы»: факт-пакеты по направлениям работ (ДО,
      ТОиР, КР ПД, КР ХС), загрузка форм, маршрут согласования ЦФО/ДТОиР,
      замечания
  - name: Plans
    description: >
      Модуль «План на 2027» — пообъектный план ДТОиР на планируемый год:
      создание, пакет документов по типу плана, маршрут согласования
      ЦФО/ДТОиР, замечания. Независимый домен, не связан с Corrections.
  - name: Notifications
    description: Уведомления пользователя

security:
  - cookieAuth: []

