# Дев-оверлей: монтирует исходники с хоста и запускает bun/nest в watch-режиме,
# чтобы правки в IDE подхватывались без пересборки образа.
# Запуск: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up --build

services:
  backend:
    build:
      target: dev
    # Отдельный тег, чтобы сборка dev-стадии не перезаписывала
    # gasdashboard-backend:latest, которым пользуется обычный `docker compose up`.
    image: gasdashboard-backend:dev
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      target: dev
    image: gasdashboard-frontend:dev
    environment:
      NODE_ENV: development
      # next dev не проходит build-стадию, поэтому NEXT_PUBLIC_* нужны как runtime
      # environment, а не только как build args (см. docker-compose.yml).
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Дэшборд Нефтегаз}
      NEXT_PUBLIC_FRONT_URL: ${NEXT_PUBLIC_FRONT_URL:-http://localhost:3000}
      NEXT_PUBLIC_BFF_PATH: ${NEXT_PUBLIC_BFF_PATH:-/api}
      NEXT_PUBLIC_MOCK_MODE: ${NEXT_PUBLIC_MOCK_MODE:-false}
    volumes:
      - ../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      - frontend_api_node_modules:/app/packages/api/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
  frontend_api_node_modules:
